# Configuration Semgrep personnalisée
# Combine plusieurs packs publics adaptés à ma stack (Python, JS, React, Node, SQL)
# + une règle custom pour un pattern spécifique à mes projets

rules:
  # ──────────────────────────────────────────
  # Règle custom : détecte les mots de passe en dur dans le code
  # (complète Gitleaks qui scanne le texte brut, ici Semgrep comprend le contexte du code)
  # ──────────────────────────────────────────
  - id: hardcoded-password-assignment
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret)
    message: >
      Mot de passe ou secret potentiellement codé en dur détecté.
      Utilise une variable d'environnement ou un gestionnaire de secrets (ex: Vault, .env).
    languages: [python, javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write
  packages: write

jobs:
  security-scans:
    name: Scans de sécurité et tests
    uses: ./.github/workflows/_security-scans.yml
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    name: Build et scan de l'image
    needs: [security-scans]
    uses: ./.github/workflows/_build.yml
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Déploiement
    needs: [build-and-scan]
    uses: ./.github/workflows/_deploy.yml
    secrets:
      RENDER_PRODUCTION_DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
      RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
      STAGING_URL: ${{ secrets.STAGING_URL }}

  defectdojo:
    name: Import vers DefectDojo
    # Tourne toujours, même si deploy échoue
    # N'attend PAS le deploy — les scans suffisent
    if: always()
    needs:
      - security-scans
      - build-and-scan
      - deploy
    uses: ./.github/workflows/_defectdojo.yml
    secrets:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
      DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
name: Security Scans (reusable)

on:
  workflow_call:
    secrets:
      VAULT_ADDR:
        required: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:

  secrets-scan:
    name: Gitleaks - Détection de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5
        with:
          fetch-depth: 0

      - name: Lancer Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer rapport JSON Gitleaks
        if: always()
        run: |
          gitleaks detect \
          --source . \
          --report-format json \
          --report-path gitleaks-report.json \
          --exit-code 0

      - name: Sauvegarder rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7


  sast-scan:
    name: Semgrep - Analyse statique du code (SAST)
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    if: github.actor != 'dependabot[bot]'

    permissions:
      contents: read
      id-token: write # requis pour l'auth OIDC GitHub -> Vault

    steps:
      - name: Checkout du code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - name: Récupérer SEMGREP_APP_TOKEN depuis Vault (OIDC, sans credential statique)
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          method: jwt
          url: ${{ secrets.VAULT_ADDR }}
          role: secure-pipeline-ci
          secrets: secret/data/secure-pipeline/semgrep SEMGREP_APP_TOKEN

      - name: Lancer Semgrep Scan (politique Semgrep AppSec Platform)
        run: |
          semgrep ci \
          --json \
          --output semgrep-report.json

      - name: Sauvegarder rapport Semgrep
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 7


  sca-scan:
    name: Trivy - Analyse des dépendances (SCA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - name: Trivy - Scan des dépendances
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # main, post-v0.36.0 (2026-07-02)
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-results.json

      - name: Sauvegarder rapport Trivy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-rapport-complet
          path: trivy-results.json
          retention-days: 7

      - name: Trivy - Génération SBOM CycloneDX
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # main, post-v0.36.0 (2026-07-02)
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json

      - name: Sauvegarder SBOM CycloneDX
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30

      - name: Vérifier vulnérabilités bloquantes
        run: |
          CRITICAL_HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-results.json)

          echo "Nombre de vulnérabilités Critical/High trouvées : $CRITICAL_HIGH_COUNT"

          if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
            echo "❌ Pipeline bloqué : $CRITICAL_HIGH_COUNT vulnérabilité(s) Critical/High détectée(s)"
            exit 1
          else
            echo "✅ Aucune vulnérabilité Critical/High, pipeline continue"
          fi


  iac-scan:
    name: Trivy - Analyse de configuration (IaC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - name: Trivy - Scan de configuration (Dockerfile)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # main, post-v0.36.0 (2026-07-02)
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-iac-results.json

      - name: Sauvegarder rapport Trivy IaC
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-iac-rapport
          path: trivy-iac-results.json
          retention-days: 7

      - name: Vérifier vulnérabilités bloquantes
        run: |
          CRITICAL_HIGH_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-iac-results.json)

          echo "Nombre de misconfigurations Critical/High trouvées : $CRITICAL_HIGH_COUNT"

          if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
            echo "❌ Pipeline bloqué : $CRITICAL_HIGH_COUNT misconfiguration(s) Critical/High détectée(s)"
            exit 1
          else
            echo "✅ Aucune misconfiguration Critical/High, pipeline continue"
          fi


  unit-tests:
    name: Pytest - Tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v5

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest pytest-cov

      - name: Tests unitaires avec couverture
        run: |
          pytest test_app.py -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-report=xml

      - name: Sauvegarder rapport couverture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
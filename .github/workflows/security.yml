name: Security Pipeline

on:
  # Lance le pipeline à chaque push sur main
  push:
    branches: [main]
  # Lance le pipeline à chaque pull request visant main
  pull_request:
    branches: [main]
  # Permet de lancer le pipeline manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch: {}

# Restreint les droits du token GITHUB_TOKEN au strict nécessaire (lecture seule)
# Principe du moindre privilège : le pipeline n'a besoin que de lire le code
permissions:
  contents: read
  issues: write # nécessaire pour enregstre les rapport owazap  dans les artefacts  
  actions: write #Pour régler ton erreur actuelle et autoriser l'upload de l'artefact 
jobs:
  # --- JOB 1 : Détection de secrets ---
  secrets-scan:
    name: Gitleaks - Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6
        with:
          # Récupère tout l'historique git (pas juste le dernier commit)
          # nécessaire pour que Gitleaks puisse scanner les anciens commits aussi
          fetch-depth: 0

      - name: Lancer Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Token fourni automatiquement par GitHub, utilisé par Gitleaks
          # pour commenter les PR en cas de secret détecté
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2 : Analyse statique du code (SAST) ---
  sast-scan:
    name: semgrep - Analyse statique du code (SAST)
    # Ce job attend que secrets-scan soit terminé ET réussi avant de démarrer
    # Logique "fail fast" : si un secret a fuité, pas besoin d'analyser le code
    needs: []
    runs-on: ubuntu-latest
    container:
      # Image Docker officielle contenant Semgrep déjà installé
      image: semgrep/semgrep
    # Évite un bug de permissions connu : les PR de Dependabot ont des droits
    # restreints qui font planter Semgrep, donc on skip dans ce cas précis
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Lancer Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    ## --- JOB 3 : Analyse de la sécurité des dépendances ---
  sca-scan:
    name: Trivy - Analyse des dépendances (SCA)
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      # Un seul scan, toutes sévérités, format JSON pour pouvoir l'analyser ensuite
      # exit-code à 0 : on ne bloque jamais ICI, on décide du blocage nous-mêmes après
      - name: Trivy - Scan des dépendances (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-results.json

      # Sauvegarde le rapport complet en artifact pour visibilité totale
      # On peut le télécharger depuis l'onglet Actions de GitHub
      - name: Sauvegarder le rapport complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-rapport-complet
          path: trivy-results.json
          retention-days: 7

      - name: Trivy - Génération du SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.json
          
      # Sauvegarde le SBOM pour visibilité et audit
      - name: Sauvegarder le SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 30
      # On lit le même fichier JSON et on vérifie nous-mêmes s'il y a du Critical/High
      # Si oui, on fait échouer le job manuellement avec exit 1
      - name: Vérifier s'il y a des vulnérabilités bloquantes
        run: |
          CRITICAL_HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-results.json)
          echo "Nombre de vulnérabilités Critical/High trouvées : $CRITICAL_HIGH_COUNT"
          if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
            echo "❌ Pipeline bloqué : $CRITICAL_HIGH_COUNT vulnérabilité(s) Critical/High détectée(s)"
            exit 1
          else
            echo "✅ Aucune vulnérabilité Critical/High, pipeline continue"
          fi

  build:
    name: Build
    needs: [secrets-scan, sast-scan, sca-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. ÉTAPE MANQUANTE 2 : Build de l'image en local sur le runner GitHub
      - name: Build de l'image Docker
        run: docker build -t mini-flask-app:${{ github.sha }} .

      # 3. Ton étape de création du fichier .env
      - name: Créer le fichier .env depuis les secrets GitHub
        run: |
          cat << EOF > .env.production
          EXTERNAL_API_KEY=${{ secrets.EXTERNAL_API_KEY_TEST }}
          EOF

      # 4. Ton étape de run (qui va maintenant fonctionner car l'image existe localement !)
      - name: Lancer le conteneur avec le fichier .env
        run: |
          docker run -d \
          -p 127.0.0.1:5000:5000 \
          --env-file .env.production \
          --name test-container \
          --read-only \
          --tmpfs /tmp \
          --security-opt no-new-privileges:true \
          mini-flask-app:${{ github.sha }}

      # 5. Ton étape de nettoyage
      - name: Nettoyer le fichier .env (sécurité)
        if: always()
        run: rm -f .env.production

  iac-scan:
    name: Analyse de la sécurité de l'infrastructure (IaC)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Lancer trivy pour l'analyse IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: json
          output: trivy-iac-results.json
     
      - name: Sauvegarder le rapport Trivy IaC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-rapport-complet
          path: trivy-iac-results.json
          retention-days: 7
      
      - name: Vérifier s'il y a des vulnérabilités IaC bloquantes
        run: |
          CRITICAL_HIGH_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-iac-results.json)
          echo "Nombre de vulnérabilités IaC Critical/High trouvées : $CRITICAL_HIGH_COUNT"
          if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
            echo "❌ Pipeline bloqué : $CRITICAL_HIGH_COUNT vulnérabilité(s) IaC Critical/High détectée(s)"
            exit 1
          else
            echo "✅ Aucune vulnérabilité IaC Critical/High, pipeline continue"
          fi
        
  deploy-staging:
    name: Déployer en Staging
    needs: [iac-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Staging
        run: curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Attendre la fin du déploiement
        run: sleep 60

  dast-scan-staging:
    name: OWASP ZAP - Test sur Staging
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Lancer OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_URL }}
          artifact_name: 'zapreport'      
    
      - name: Sauvegarder les rapports ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-rapport
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 7

  deploy-production:
    name: Déployer en Production
    needs: [dast-scan-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Production
        run: curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"
name: Security Pipeline

on:
  # Lance le pipeline à chaque push sur main
  push:
    branches: [main]
  # Lance le pipeline à chaque pull request visant main
  pull_request:
    branches: [main]
  # Permet de lancer le pipeline manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch: {}

# Restreint les droits du token GITHUB_TOKEN au strict nécessaire (lecture seule)
# Principe du moindre privilège : le pipeline n'a besoin que de lire le code
permissions:
  contents: read

jobs:
  # --- JOB 1 : Détection de secrets ---
  secrets-scan:
    name: Gitleaks - Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6
        with:
          # Récupère tout l'historique git (pas juste le dernier commit)
          # nécessaire pour que Gitleaks puisse scanner les anciens commits aussi
          fetch-depth: 0

      - name: Lancer Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Token fourni automatiquement par GitHub, utilisé par Gitleaks
          # pour commenter les PR en cas de secret détecté
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2 : Analyse statique du code (SAST) ---
  sast-scan:
    name: semgrep/ci
    # Ce job attend que secrets-scan soit terminé ET réussi avant de démarrer
    # Logique "fail fast" : si un secret a fuité, pas besoin d'analyser le code
    needs: secrets-scan
    runs-on: ubuntu-latest
    container:
      # Image Docker officielle contenant Semgrep déjà installé
      image: semgrep/semgrep
    # Évite un bug de permissions connu : les PR de Dependabot ont des droits
    # restreints qui font planter Semgrep, donc on skip dans ce cas précis
    if: (github.actor != 'dependabot[bot]')
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Lancer Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    ## --- JOB 3 : Analyse de la sécurité des dépendances ---
  sca-scan:
    name: Trivy - Analyse des dépendances (SCA)
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      # Étape 1 : scan complet, TOUTES les sévérités, ne bloque jamais
      # Produit un rapport complet pour visibilité totale de l'équipe sécurité
      - name: Trivy - Rapport complet (toutes sévérités)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: 0
          format: table
          output: trivy-rapport-complet.txt

      # Étape 2 : vérification de blocage, seulement CRITICAL/HIGH
      # Cette étape fait planter le job si elle trouve quelque chose
      - name: Trivy - Vérification de blocage (Critical/High)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      # Étape 3 : sauvegarder le rapport complet comme artifact
      # Téléchargeable depuis l'onglet Actions, même si le job échoue à l'étape 2
      - name: Sauvegarder le rapport complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-rapport-complet
          path: trivy-rapport-complet.txt
          retention-days: 7
        
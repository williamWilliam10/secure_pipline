name: Import Security Reports to DefectDojo (reusable)

on:
  workflow_call:
    secrets:
      DEFECTDOJO_URL:
        required: true
      DEFECTDOJO_API_KEY:
        required: true
      DEFECTDOJO_PRODUCT_NAME:
        required: true
      DEFECTDOJO_ENGAGEMENT_NAME:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  defectdojo:
    name: Import des rapports dans DefectDojo
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # main, post-v8.0.1 (2026-03-12)
        with:
          path: reports

      - name: Vérifier les rapports disponibles
        run: |
          echo "===== ARBORESCENCE DES RAPPORTS ====="
          ls -R reports || echo "Aucun rapport trouvé"

      - name: Import vers DefectDojo (reimport avec fermeture auto)
        shell: bash
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_PRODUCT_NAME: ${{ secrets.DEFECTDOJO_PRODUCT_NAME }}
          DD_ENGAGEMENT_NAME: ${{ secrets.DEFECTDOJO_ENGAGEMENT_NAME }}

        run: |

          # Fonction reimport — ferme automatiquement les findings corrigés
          # test_title stable = DefectDojo retrouve le bon test à chaque run
          reimport_scan() {
            FILE="$1"
            TYPE="$2"
            TITLE="$3"

            echo ""
            echo "================================="
            echo "Fichier : $FILE"
            echo "Type    : $TYPE"
            echo "Titre   : $TITLE"
            echo "================================="

            if [ ! -f "$FILE" ]; then
              echo "⚠️  Fichier absent, scan ignoré : $FILE"
              return 0
            fi

            echo "Taille fichier : $(ls -lh "$FILE" | awk '{print $5}')"

            # Le `|| printf ...` évite qu'une connexion impossible (DefectDojo injoignable)
            # ne tue le script entier via `set -e` et ne saute silencieusement les rapports
            # suivants ; --connect-timeout/--max-time : échoue vite plutôt que de bloquer le job.
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              -X POST "${DD_URL}/api/v2/reimport-scan/" \
              -H "Authorization: Token ${DD_API_KEY}" \
              -F "product_name=${DD_PRODUCT_NAME}" \
              -F "engagement_name=${DD_ENGAGEMENT_NAME}" \
              -F "auto_create_context=true" \
              -F "scan_type=${TYPE}" \
              -F "test_title=${TITLE}" \
              -F "file=@${FILE}" \
              -F "active=true" \
              -F "verified=false" \
              -F "close_old_findings=true" \
              -F "close_old_findings_product_scope=false" \
              -F "minimum_severity=Low" \
              -F "deduplication_on_engagement=false" || printf '\nCURL_CONNECTION_FAILED')

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)

            if [[ "$HTTP_CODE" == "201" || "$HTTP_CODE" == "200" ]]; then
              echo "✅ Import réussi (HTTP $HTTP_CODE)"
            else
              echo "❌ Échec import (HTTP $HTTP_CODE)"
              echo "Réponse : $BODY"
              # On ne fait pas exit 1 pour ne pas bloquer les autres imports
            fi
            echo ""
          }

          # ─── TRIVY SCA ────────────────────────────────────────────
          reimport_scan \
            "reports/trivy-rapport-complet/trivy-results.json" \
            "Trivy Scan" \
            "Trivy SCA - Dependencies"

          # ─── SBOM CYCLONEDX ───────────────────────────────────────
          reimport_scan \
            "reports/sbom-cyclonedx/sbom.json" \
            "CycloneDX Scan" \
            "SBOM CycloneDX"

          # ─── TRIVY IMAGE ──────────────────────────────────────────
          reimport_scan \
            "reports/trivy-image-rapport/trivy-image-results.json" \
            "Trivy Scan" \
            "Trivy Image Scan"

          # ─── TRIVY IAC ────────────────────────────────────────────
          reimport_scan \
            "reports/trivy-iac-rapport/trivy-iac-results.json" \
            "Trivy Scan" \
            "Trivy IaC Scan"

          # ─── OWASP ZAP DAST ───────────────────────────────────────
          # DefectDojo préfère le XML pour ZAP
          reimport_scan \
            "reports/zap-rapport/zap_report.xml" \
            "ZAP Scan" \
            "OWASP ZAP DAST - Staging"

          # ─── SEMGREP SAST ─────────────────────────────────────────
          reimport_scan \
            "reports/semgrep-report/semgrep-report.json" \
            "Semgrep JSON Report" \
            "Semgrep SAST"

          # ─── GITLEAKS ─────────────────────────────────────────────
          reimport_scan \
            "reports/gitleaks-report/gitleaks-report.json" \
            "Gitleaks Scan" \
            "Gitleaks Secret Scan"

          echo ""
          echo "================================="
          echo "✅ Import DefectDojo terminé"
          echo "================================="
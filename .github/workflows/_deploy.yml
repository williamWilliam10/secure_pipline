name: Deploy (reusable)

on:
  workflow_call:

jobs:
  deploy-staging:
    name: Déployer en Staging
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Staging
        run: curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Attendre la fin du déploiement
        run: sleep 60

  dast-scan-staging:
    name: OWASP ZAP - Test sur Staging
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Lancer le scan ZAP directement via Docker
        run: |
          mkdir -p zap-reports
          chmod -R 777 zap-reports
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t ${{ secrets.STAGING_URL }} \
            -J zap_report.json \
            -w zap_report.md \
            -r zap_report.html \
            -I
        continue-on-error: true

      - name: Sauvegarder les rapports ZAP
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf88e
        with:
          name: zap-rapport
          path: zap-reports/
          retention-days: 7

  deploy-production:
    name: Déployer en Production
    needs: [dast-scan-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Production
        run: curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"
<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture du pipeline de securite CI/CD</title>
<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
  .sub { font-size: 11px; fill: #555555; }
  .node { fill: #ffffff; stroke: #333333; stroke-width: 1.2; }
  .arr { stroke: #333333; stroke-width: 1.2; fill: none; }
  .lbl { font-size: 10px; fill: #777777; }
  .group { fill: none; stroke: #999999; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L8 5L1 9 Z" fill="#333333"/>
</marker>
</defs>

<rect x="270" y="20" width="140" height="40" rx="3" class="node"/>
<text class="title" x="340" y="44" text-anchor="middle">push / pull_request</text>
<line x1="340" y1="60" x2="340" y2="92" class="arr" marker-end="url(#arrow)"/>

<rect class="group" x="30" y="100" width="620" height="100"/>
<text class="lbl" x="44" y="116">exécution en parallèle</text>

<rect x="50" y="130" width="170" height="50" rx="3" class="node"/>
<text class="title" x="135" y="150" text-anchor="middle">Gitleaks</text>
<text class="sub" x="135" y="166" text-anchor="middle">détection de secrets</text>

<rect x="255" y="130" width="170" height="50" rx="3" class="node"/>
<text class="title" x="340" y="150" text-anchor="middle">Semgrep</text>
<text class="sub" x="340" y="166" text-anchor="middle">SAST</text>

<rect x="460" y="130" width="170" height="50" rx="3" class="node"/>
<text class="title" x="545" y="150" text-anchor="middle">Trivy</text>
<text class="sub" x="545" y="166" text-anchor="middle">SCA + SBOM</text>

<line x1="135" y1="180" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="180" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="180" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<text class="lbl" x="450" y="208" text-anchor="middle">les 3 jobs doivent réussir</text>

<rect x="240" y="220" width="200" height="50" rx="3" class="node"/>
<text class="title" x="340" y="240" text-anchor="middle">Build + push image</text>
<text class="sub" x="340" y="256" text-anchor="middle">ghcr.io</text>
<line x1="340" y1="270" x2="340" y2="302" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="302" width="200" height="50" rx="3" class="node"/>
<text class="title" x="340" y="322" text-anchor="middle">Trivy image scan</text>
<text class="sub" x="340" y="338" text-anchor="middle">ignore-unfixed</text>
<line x1="340" y1="352" x2="340" y2="384" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="384" width="200" height="50" rx="3" class="node"/>
<text class="title" x="340" y="404" text-anchor="middle">Deploy staging</text>
<text class="sub" x="340" y="420" text-anchor="middle">Render</text>
<line x1="340" y1="434" x2="340" y2="466" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="466" width="200" height="50" rx="3" class="node"/>
<text class="title" x="340" y="486" text-anchor="middle">OWASP ZAP</text>
<text class="sub" x="340" y="502" text-anchor="middle">DAST</text>
<line x1="340" y1="516" x2="340" y2="548" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="548" width="200" height="50" rx="3" class="node"/>
<text class="title" x="340" y="568" text-anchor="middle">Deploy production</text>
<text class="sub" x="340" y="584" text-anchor="middle">Render</text>

<rect x="20" y="610" width="14" height="14" class="node"/>
<text class="lbl" x="40" y="621">étape</text>
<line x1="120" y1="617" x2="150" y2="617" class="arr" marker-end="url(#arrow)"/>
<text class="lbl" x="160" y="621">dépendance / flux</text>
<rect x="320" y="610" width="14" height="14" class="group"/>
<text class="lbl" x="340" y="621">groupe parallèle</text>

</svg>
